# fly.toml app configuration file generated for chord-shifter on 2026-05-15T21:32:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chord-shifter'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'sqlite:/data/chord_shifter.db'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
